name: fast
# Parallel jobs, affected-only tests on PRs, LPT-sharded bun test.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      mode:
        description: full runs every test file, pr runs only the affected files
        type: choice
        options: [full, pr]
        default: full
      base:
        description: Base commit SHA (pr mode)
        default: ""
      head:
        description: Head commit SHA (pr mode)
        default: ""

permissions:
  contents: read

concurrency:
  group: fast-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      count: ${{ steps.plan.outputs.count }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ci/test-timings.json
          key: timings-none
          restore-keys: timings-
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          IN_MODE: ${{ inputs.mode }}
          IN_BASE: ${{ inputs.base }}
          IN_HEAD: ${{ inputs.head }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: bun scripts/plan.ts

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: bun run fmt:check

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: bun run lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: bun run check

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: bun run build

  tooling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - run: bun run test:tooling

  test:
    name: test (shard ${{ matrix.shard }})
    needs: plan
    if: needs.plan.outputs.count != '0'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: bun test
        env:
          FILES: ${{ matrix.files }}
          SHARD: ${{ matrix.shard }}
        run: |
          set -o pipefail
          read -ra list <<< "$FILES"
          files=${#list[@]}
          if [ "$files" -eq 0 ]; then echo "no test files in this shard, skipping"; exit 0; fi
          bun test --reporter=junit --reporter-outfile="junit-${SHARD}.xml" "${list[@]}" 2>&1 | tee bun.log
          passed=$(sed -nE 's/^ *([0-9]+) pass$/\1/p' bun.log)
          # Parsed by parseTestsNotice in scripts/bench.ts: keep the "TESTS files=N passed=N" format.
          echo "TESTS files=${files} passed=${passed}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-${{ matrix.shard }}
          path: junit-${{ matrix.shard }}.xml

  ci-ok:
    needs: [plan, fmt, lint, typecheck, build, tooling, test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: check needs
        env:
          PLAN: ${{ needs.plan.result }}
          FMT: ${{ needs.fmt.result }}
          LINT: ${{ needs.lint.result }}
          TYPECHECK: ${{ needs.typecheck.result }}
          BUILD: ${{ needs.build.result }}
          TOOLING: ${{ needs.tooling.result }}
          TEST: ${{ needs.test.result }}
          COUNT: ${{ needs.plan.outputs.count }}
        run: |
          for r in "$PLAN" "$FMT" "$LINT" "$TYPECHECK" "$BUILD" "$TOOLING"; do
            [ "$r" = success ] || { echo "a required job did not succeed"; exit 1; }
          done
          if [ "$TEST" = success ]; then exit 0; fi
          if [ "$TEST" = skipped ] && [ "$COUNT" = 0 ]; then echo "no affected tests"; exit 0; fi
          echo "test result: $TEST"
          exit 1

  timings:
    needs: test
    if: github.event_name == 'push' && needs.test.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: junit-*
          path: junit
          merge-multiple: true
      - run: |
          mkdir -p .ci
          bun scripts/timings.ts merge junit/*.xml > .ci/test-timings.json
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ci/test-timings.json
          key: timings-${{ github.run_id }}
