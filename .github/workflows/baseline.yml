name: baseline
# The common "before" pipeline: one job, serial steps, Node tools, no sharding.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      mode:
        description: Ignored. Accepted so the bench can dispatch both workflows alike.
        default: full

permissions:
  contents: read

concurrency:
  group: baseline-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test (baseline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.5
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.5
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - name: fmt
        run: npm run legacy:fmt
      - name: lint
        run: npm run legacy:lint
      - name: typecheck
        run: npm run legacy:check
      - name: build
        run: bun run build
      - name: vitest
        run: |
          set -o pipefail
          npm run legacy:test 2>&1 | tee vitest.log
          files=$(sed 's/\x1b\[[0-9;]*m//g' vitest.log | sed -nE 's/^ *Test Files +([0-9]+) passed.*/\1/p')
          passed=$(sed 's/\x1b\[[0-9;]*m//g' vitest.log | sed -nE 's/^ *Tests +([0-9]+) passed.*/\1/p')
          echo "::notice::TESTS files=${files} passed=${passed}"
